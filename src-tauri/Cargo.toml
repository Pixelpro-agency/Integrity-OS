[package]
name = "project-integrity-os"
version = "0.1.0"
description = "Project Integrity OS"
authors = ["Project Integrity OS"]
edition = "2021"

[lib]
name = "project_integrity_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
